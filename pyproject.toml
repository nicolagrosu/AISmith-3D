[project]
name = "local-3d-studio"
version = "0.1.0"
description = "A local, memory-aware 3D generation studio for the OpenAI Build Week hackathon."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "numpy>=1.26",
  "trimesh>=4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
